<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Globe -->
  <circle cx="55" cy="60" r="28" fill="#1a2e5a"/>
  <!-- Continent shapes on globe -->
  <path d="M42 45c2-3 5-5 9-6 1 0 3 1 4 3 1 1 0 3-1 4-2 2-1 4 1 5 2 1 4 0 5-1 2-2 5-2 7 0 1 1 2 3 1 5-1 3-4 5-7 5-2 0-3 1-3 3 0 2 1 4 3 5 1 1 1 3 0 4-2 2-5 3-7 2-3-1-5-3-5-6 0-2-1-4-3-5-1-1-3-1-4 0-2 1-4 0-5-2-1-2 0-5 1-7 1-1 2-3 4-3z" fill="#243d72" opacity="0.7"/>
  <path d="M62 50c3 1 5 4 6 7 1 3 0 6-2 8-1 1-1 3 0 4 2 2 2 5 0 7-1 2-3 3-5 3-3 0-5-2-5-5 0-2-1-3-3-3-1-1-2-2-2-4 1-3 3-5 5-7 2-2 4-5 4-8 0-1 1-2 2-2z" fill="#1e3566" opacity="0.5"/>
  <!-- Meridian lines on globe -->
  <ellipse cx="55" cy="60" rx="12" ry="28" stroke="#2a4a80" stroke-width="0.8" fill="none" opacity="0.4"/>
  <line x1="27" y1="60" x2="83" y2="60" stroke="#2a4a80" stroke-width="0.8" opacity="0.3"/>
  <ellipse cx="55" cy="60" rx="22" ry="10" stroke="#2a4a80" stroke-width="0.6" fill="none" opacity="0.3" transform="rotate(-15 55 60)"/>
  <!-- Globe highlight -->
  <ellipse cx="45" cy="48" rx="10" ry="14" fill="url(#highlight)" opacity="0.15"/>

  <!-- Orbital ring 1 - main tilted ring -->
  <ellipse cx="58" cy="58" rx="50" ry="18" stroke="#1a2e5a" stroke-width="2.2" fill="none" transform="rotate(-30 58 58)"/>
  <!-- Orbital ring 2 -->
  <ellipse cx="58" cy="58" rx="48" ry="16" stroke="#1a2e5a" stroke-width="1.8" fill="none" transform="rotate(35 58 58)"/>
  <!-- Orbital ring 3 -->
  <ellipse cx="58" cy="58" rx="46" ry="14" stroke="#1a2e5a" stroke-width="1.5" fill="none" transform="rotate(-75 58 58)"/>

  <!-- Small dots on orbits -->
  <circle cx="18" cy="38" r="3" fill="#1a2e5a"/>
  <circle cx="100" cy="72" r="2.5" fill="#1a2e5a"/>
  <circle cx="38" cy="15" r="2" fill="#1a2e5a"/>
  <circle cx="82" cy="98" r="2.5" fill="#1a2e5a"/>
  <circle cx="92" cy="30" r="2" fill="#1a2e5a"/>

  <defs>
    <radialGradient id="highlight" cx="0.3" cy="0.3">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
